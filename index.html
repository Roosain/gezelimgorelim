<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Akış</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      margin: 0;
      padding: 30px;
      color: #222;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #d63384;
      margin-bottom: 20px;
    }
    #chat {
      height: 420px;
      overflow-y: auto;
      background: #fff8fb;
      border: 1px solid #f0d2e4;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 16px;
    }
    .msg {
      background: #fceaf4;
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
    }
    .msg strong {
      display: block;
      color: #7a1b54;
      margin-bottom: 4px;
    }
    form {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e7bdd6;
      font-size: 16px;
    }
    button {
      background: #d63384;
      border: none;
      border-radius: 10px;
      color: white;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💞 Canlı Akış</h1>

    <div id="chat"></div>

    <form id="form">
      <input id="sender" type="text" value="Sen" placeholder="İsmin" />
      <input id="message" type="text" placeholder="Mesaj yaz..." required />
      <button type="submit">Gönder</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://nkhzvrkmbxvkrpyofeeq.supabase.co";
    const supabaseKey = "sb_publishable_jlBSWd_G-CYUkJcLSeFKrw_dgtFOCWz";
    const roomId = "love-room-1";

    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const senderInput = document.getElementById("sender");
    const messageInput = document.getElementById("message");

    function renderMessage(msg) {
      const el = document.createElement("div");
      el.className = "msg";
      const time = new Date(msg.created_at).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

      el.innerHTML = `
        <strong>${msg.sender}</strong>
        <div>${msg.text}</div>
        <small>${time}</small>
      `;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    async function loadMessages() {
      const { data, error } = await supabase
        .from("messages")
        .select("*")
        .eq("room_id", roomId)
        .order("created_at", { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      chat.innerHTML = "";
      data.forEach(renderMessage);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const sender = senderInput.value.trim() || "Sen";
      const text = messageInput.value.trim();

      if (!text) return;

      const { error } = await supabase.from("messages").insert([
        { room_id: roomId, sender, text }
      ]);

      if (error) {
        console.error(error);
        alert("Mesaj gönderilemedi.");
        return;
      }

      messageInput.value = "";
    });

    supabase
      .channel("room-live")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter: `room_id=eq.${roomId}`
        },
        (payload) => {
          renderMessage(payload.new);
        }
      )
      .subscribe();

    loadMessages();
  </script>
</body>
</html>
