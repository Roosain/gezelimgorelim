name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # URL sonundaki olası fazla slash ve ekleri otomatik temizler
          CLEAN_URL=$(echo "${{ secrets.SUPABASE_URL }}" | sed 's|/rest/v1/*$||' | sed 's|/*$||')
          
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$CLEAN_URL/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Alınan HTTP Durum Kodu: $response"
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 204 ]; then
            echo "Supabase başarıyla pingle-ndi ve aktif tutuldu."
            exit 0
          else
            echo "Hata! Beklenmeyen HTTP Kodu: $response"
            exit 1
          fi
