name: Supabase Keep Alive

on:
  schedule:
    # Her 3 günde bir gece 00:00'da otomatik çalışır (7 günlük limite takılmayı engeller)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # GitHub arayüzünden istediğiniz zaman elle çalıştırabilmenizi sağlar

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "HTTP Durum Kodu: $response"
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 204 ]; then
            echo "Supabase başarıyla pingle-ndi ve aktif tutuldu."
            exit 0
          else
            echo "İstek başarısız oldu!"
            exit 1
          fi
